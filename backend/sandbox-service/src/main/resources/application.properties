# ===========================================
# APPLICATION
# ===========================================
spring.application.name=sandbox-service
server.port=8084

# ===========================================
# DATABASE - PostgreSQL
# ===========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/apiarena
spring.datasource.username=apiarena_user
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# JWT CONFIGURATION (para validar tokens)
# ===========================================
jwt.secret=${JWT_SECRET}

# ===========================================
# KAFKA
# ===========================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=sandbox-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ===========================================
# SANDBOX CONFIGURATION
# ===========================================
sandbox.container.memory-limit=256m
sandbox.container.cpu-limit=1.0
sandbox.container.timeout-seconds=120
sandbox.container.network-disabled=true
sandbox.uploads-dir=/tmp/sandbox-uploads
sandbox.runner.mode=dind
# Bridge created inside the dedicated sandbox-dind daemon (Compose sets DOCKER_HOST).
sandbox.dind.network=apiarena-candidates-internal
# Hostname used by testing/readiness for -p published ports on the DinD sidecar.
sandbox.dind.publish-host=sandbox-dind
sandbox.dind.container-port=8080
sandbox.dind.pids-limit=256
sandbox.dind.use-init=true
sandbox.dind.nofile-ulimit=8192:8192
# Candidate image builds: dedicated buildx builder (memory/CPU capped). daemon builder.gc does not apply to docker-container driver.
sandbox.buildx.builder-name=apiarena-candidates
sandbox.buildx.driver-opt=memory=1536m,memory-swap=1536m,cpu-quota=200000,cpu-period=100000
sandbox.buildx.keep-storage=2gb
sandbox.internal-token=

# ===========================================
# SWAGGER / OPENAPI
# ===========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}

# ===========================================
# ACTUATOR (Health checks)
# ===========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ===========================================
# LOGGING
# ===========================================
logging.level.com.apiarena.sandboxservice=DEBUG
logging.level.org.springframework.security=DEBUG

# ===========================================
# CORS (para frontend)
# ===========================================
cors.allowed-origins=http://localhost:3000,http://localhost:5173
