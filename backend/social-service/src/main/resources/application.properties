spring.application.name=social-service
server.port=8091

spring.datasource.url=jdbc:postgresql://localhost:5432/apiarena
spring.datasource.username=apiarena_user
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}

services.auth-url=${SERVICES_AUTH_URL:http://localhost:8081}
services.submission-url=${SERVICES_SUBMISSION_URL:http://localhost:8083}
services.notification-url=${SERVICES_NOTIFICATION_URL:http://localhost:8090}
services.internal-token=${SERVICES_INTERNAL_TOKEN:}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=social-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
apiarena.kafka.topic.submission-completed=apiarena.submissions.completed
apiarena.kafka.topic.user-activity=apiarena.user.activity

app.social.enabled=${APP_SOCIAL_ENABLED:false}
app.social.friend-cache-seconds=30

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized

logging.level.com.apiarena.socialservice=INFO
logging.level.org.springframework.security=INFO

cors.allowed-origins=http://localhost:3000,http://localhost:5173
