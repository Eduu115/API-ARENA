spring.application.name=content-service
server.port=8092

spring.datasource.url=jdbc:postgresql://localhost:5432/apiarena
spring.datasource.username=apiarena_user
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by docker/postgres/alter-content.sql (and init-db.sql).
# ddl-auto stays none so Hibernate cannot create tables that skip the CHECKs.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Same Base64 HMAC secret as auth-service.
jwt.secret=${JWT_SECRET:}

# Empty key: translations are skipped, the source text is kept, the admin is warned.
deepl.api-key=${DEEPL_API_KEY:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

logging.level.com.apiarena.contentservice=INFO
logging.level.org.springframework.security=INFO
