name: Deploy production

# Runs on the self-hosted runner installed on the API Arena server (Tailscale-only,
# so GitHub-hosted runners cannot SSH in). Push to main only — not pull requests.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: /home/dudu/apps/API-ARENA

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, apiarena]
    timeout-minutes: 40
    steps:
      # Baseline before recreate: catch restart loops that survive the deploy.
      # Recreated containers reset RestartCount to 0; OOMKilled still catches those.
      - name: Snapshot restart counts
        run: |
          set -euo pipefail
          mkdir -p /tmp/apiarena-deploy
          : > /tmp/apiarena-deploy/restart-counts-before.txt
          # Names must start with apiarena- (exclude host buildx_*apiarena-* leftovers).
          for c in $(docker ps -a --format '{{.Names}}' | grep '^apiarena-' | sort); do
            count=$(docker inspect -f '{{.RestartCount}}' "$c" 2>/dev/null || echo 0)
            echo "$c $count" >> /tmp/apiarena-deploy/restart-counts-before.txt
          done
          echo "Restart counts before deploy:"
          cat /tmp/apiarena-deploy/restart-counts-before.txt

      - name: Backup databases
        run: |
          set -euo pipefail
          ./deploy/backup-db.sh

      - name: Pull, build and start
        run: |
          set -euo pipefail
          ./deploy/deploy.sh

      - name: Wait for gateway health
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsS http://127.0.0.1:3000/api/gateway/health | grep -q '"overall"'; then
              curl -fsS http://127.0.0.1:3000/api/gateway/health
              echo
              exit 0
            fi
            sleep 5
          done
          echo "Gateway health did not respond" >&2
          docker compose ps
          exit 1

      - name: Check memory stats and OOM
        run: |
          set -euo pipefail
          names=$(docker ps -a --filter 'name=apiarena-' --format '{{.Names}}' | grep -E '^apiarena-' | sort)
          if [ -z "$names" ]; then
            echo "No apiarena-* containers found" >&2
            exit 1
          fi

          echo "=== docker stats (apiarena-*) ==="
          # shellcheck disable=SC2086
          docker stats --no-stream $names

          failed=0
          declare -A before_counts
          if [ -f /tmp/apiarena-deploy/restart-counts-before.txt ]; then
            while read -r name count; do
              [ -z "${name:-}" ] && continue
              before_counts["$name"]=${count:-0}
            done < /tmp/apiarena-deploy/restart-counts-before.txt
          fi

          for c in $names; do
            oom=$(docker inspect -f '{{.State.OOMKilled}}' "$c")
            after=$(docker inspect -f '{{.RestartCount}}' "$c")
            before=${before_counts[$c]:-0}
            if [ "$oom" = "true" ]; then
              echo "FAIL: $c OOMKilled=true" >&2
              failed=1
            fi
            if [ "$after" -gt "$before" ]; then
              echo "FAIL: $c RestartCount rose ${before} -> ${after}" >&2
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "No OOM kills; restart counts stable vs pre-deploy snapshot."

      # A failed `docker compose up` can leave freshly recreated containers in
      # "created" (frontend included), which takes the site down. Start whatever
      # is stopped so the previous build keeps serving while the failure is fixed.
      - name: Recover stopped containers
        if: failure()
        run: |
          stopped="$(docker compose ps -a -q --status created --status exited)"
          if [ -n "$stopped" ]; then
            echo "$stopped" | xargs docker start || true
          fi
          docker compose ps
          curl -fsS -o /dev/null -w "frontend: %{http_code}\n" http://127.0.0.1:3000/ || true
